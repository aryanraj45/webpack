name: macOS CI experiment

on:
  workflow_dispatch:

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - max-workers
          - no-coverage
          - no-spotlight
          - combined
        part: [a, b]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true
      - run: yarn link webpack --frozen-lockfile

      - name: Turn off Spotlight indexing for the repo
        if: matrix.variant == 'no-spotlight' || matrix.variant == 'combined'
        run: sudo mdutil -i off "$(pwd)" || true

      - name: Record start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: "Run: baseline"
        if: matrix.variant == 'baseline'
        run: yarn cover:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache

      - name: "Run: max-workers=3"
        if: matrix.variant == 'max-workers'
        run: yarn cover:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache --maxWorkers=3

      - name: "Run: no-coverage"
        if: matrix.variant == 'no-coverage'
        run: yarn test:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache

      - name: "Run: no-spotlight"
        if: matrix.variant == 'no-spotlight'
        run: yarn cover:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache

      - name: "Run: combined (maxWorkers=3 + no-spotlight, with coverage)"
        if: matrix.variant == 'combined'
        run: yarn cover:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache --maxWorkers=3

      - name: Report elapsed time
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "### ${{ matrix.variant }} / part ${{ matrix.part }}: ${ELAPSED}s ($((ELAPSED / 60))m $((ELAPSED % 60))s)" >> "$GITHUB_STEP_SUMMARY"
          echo "variant=${{ matrix.variant }} part=${{ matrix.part }} elapsed_s=${ELAPSED}"
